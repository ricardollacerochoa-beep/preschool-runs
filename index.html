<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Preschool Runs</title>
<meta name="theme-color" content="#E07A5F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Preschool">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF7F1; --card:#FFFFFF; --ink:#2B2A33; --muted:#7A7685; --line:#ECE6DC;
    --accent:#E07A5F; --accent-ink:#fff; --warn:#C2582F; --radius:18px;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#1C1B21; --card:#26252D; --ink:#F2EFEA; --muted:#A39FAD; --line:#38363F; }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body{padding-top:env(safe-area-inset-top)}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
  input,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;width:100%}
  textarea{min-height:64px;resize:vertical}
  a{color:inherit}
  .wrap{max-width:560px;margin:0 auto;padding:14px 14px calc(100px + env(safe-area-inset-bottom))}
  header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 2px 14px}
  .brand h1{font-size:22px;font-weight:800;margin:0;letter-spacing:-.2px}
  .brand small{color:var(--muted);font-size:13px}
  .mechip{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 6px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:14px}
  .dot{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px;flex:none}
  .banner{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .linkbtn{font-weight:800;color:var(--accent);white-space:nowrap}
  .weeknav{display:flex;align-items:center;justify-content:space-between;margin:6px 0 12px}
  .weeknav > button{width:42px;height:42px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:20px;font-weight:800}
  .weeknav .label{text-align:center}
  .weeknav .label b{display:block;font-size:16px}
  .weeknav .label span{font-size:12px;color:var(--muted)}
  .weeknav .label button{color:var(--accent);font-size:12px;font-weight:800;padding:2px 6px}
  .day{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:10px}
  .day.today{border:2px solid var(--accent)}
  .day.past{opacity:.55}
  .dayhead{display:flex;align-items:baseline;justify-content:space-between;margin:0 2px 8px}
  .dayhead b{font-size:15px}
  .dayhead span{font-size:12px;color:var(--muted);font-weight:700}
  .slots{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .slot{border-radius:14px;padding:10px;text-align:left;min-height:70px;display:flex;flex-direction:column;justify-content:space-between;gap:4px;border:1.5px dashed var(--line);background:transparent;transition:transform .08s}
  .slot:active{transform:scale(.98)}
  .slot .k{font-size:12px;font-weight:700;color:var(--muted);display:flex;justify-content:space-between}
  .slot .who{font-size:15px;font-weight:800}
  .slot.open .who{color:var(--accent)}
  .slot.taken{border-style:solid;border-color:transparent;color:#fff}
  .slot.taken .k{color:rgba(255,255,255,.85)}
  .slot.mine{box-shadow:inset 0 0 0 2px rgba(255,255,255,.55)}
  .slot[disabled]{cursor:default}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px 16px;border-radius:14px;font-weight:800;background:var(--accent);color:var(--accent-ink);text-decoration:none;width:100%;font-size:15px}
  .btn[disabled]{opacity:.5}
  .btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
  .btn.danger{background:transparent;color:var(--warn);border:1.5px solid var(--warn)}
  .btn + .btn{margin-top:8px}
  .section-title{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:18px 4px 8px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px}
  .event{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
  .event:last-child{border-bottom:0}
  .event .txt{font-size:14px;line-height:1.35;flex:1}
  .event .time{font-size:12px;color:var(--muted)}
  .new{background:var(--accent);color:#fff;font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px;margin-left:6px;vertical-align:2px}
  .tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:5}
  .tabs[hidden]{display:none}
  .tabs .in{display:flex;max-width:560px;width:100%}
  .tab{flex:1;padding:8px 4px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:700;color:var(--muted);position:relative}
  .tab .ic{font-size:20px;line-height:1}
  .tab.on{color:var(--ink);background:var(--bg)}
  .badge{position:absolute;top:2px;right:calc(50% - 22px);background:var(--accent);color:#fff;font-size:10px;font-weight:800;border-radius:999px;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;padding:0 5px}
  .sheet-bg{position:fixed;inset:0;background:rgba(20,18,25,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20;animation:fade .15s}
  .sheet{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:up .2s ease-out}
  .sheet h2{margin:0 0 4px;font-size:19px;font-weight:800}
  .sub{margin:0 0 14px;color:var(--muted);font-size:14px}
  .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:-6px auto 12px}
  @keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:13px;font-weight:800;margin:0 2px 6px}
  .hint{font-size:12px;color:var(--muted);margin:6px 2px 0;line-height:1.4}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .swatches{display:flex;gap:10px;flex-wrap:wrap}
  .sw{width:38px;height:38px;border-radius:50%;border:3px solid transparent}
  .sw.on{border-color:var(--ink)}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .chip{padding:6px 12px;border-radius:999px;border:1.5px solid var(--line);font-size:13px;font-weight:700}
  .toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;z-index:30;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.2);animation:fade .2s}
  .muted{color:var(--muted)}
  .empty{text-align:center;color:var(--muted);padding:24px 8px;font-size:14px}
  .members{display:flex;flex-wrap:wrap;gap:8px}
  .member{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border-radius:999px;background:var(--bg);font-weight:700;font-size:13px}
  .msgbox{background:var(--bg);border-radius:12px;padding:12px;font-size:14px;white-space:pre-wrap;margin-bottom:10px;border:1px solid var(--line);word-break:break-word}
  ol.steps{padding-left:20px;margin:6px 0;font-size:14px;line-height:1.55}
  .auth{max-width:420px;margin:8vh auto 0;text-align:center}
  .auth img{width:84px;height:84px;border-radius:20px;margin-bottom:10px}
  .auth h1{margin:0 0 4px;font-size:26px;font-weight:800}
  .auth .card{text-align:left;margin-top:18px}
  .err{color:var(--warn);font-size:13px;font-weight:700;margin:4px 2px 10px}
  .seg{display:flex;background:var(--bg);border-radius:12px;padding:4px;margin-bottom:14px}
  .seg button{flex:1;padding:8px;border-radius:9px;font-weight:800;font-size:14px;color:var(--muted)}
  .seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .ok{color:#3F8F6B;font-weight:800}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="card empty">Loading…</div></div>
<nav class="tabs" id="tabsnav" hidden><div class="in" id="tabs"></div></nav>
<div id="layer"></div>
<script src="config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
