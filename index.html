<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Preschool Runs</title>
<meta name="theme-color" content="#FFF8F1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Preschool">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFF8F1; --bg2:#FDEFE4; --card:#FFFFFF; --ink:#2A2433; --muted:#857C8F; --line:#F0E6DB;
    --accent:#EF6F53; --accent2:#F7A15E; --accent-ink:#fff; --warn:#D2552F; --ok:#2F9E74;
    --radius:22px; --shadow:0 1px 2px rgba(60,30,20,.05), 0 8px 24px rgba(60,30,20,.07);
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#17151C; --bg2:#201C26; --card:#24212B; --ink:#F4EFEA; --muted:#A59DB0; --line:#34303D;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;color:var(--ink);font-family:'Nunito',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  html{background:var(--bg)}
  body{padding-top:env(safe-area-inset-top);min-height:100vh;
    background:radial-gradient(900px 420px at 110% -10%, rgba(247,161,94,.22), transparent 60%),
               radial-gradient(700px 380px at -20% 0%, rgba(239,111,83,.14), transparent 60%), var(--bg);
    background-attachment:fixed}
  h1,h2,.hero-date,.daynum{font-family:'Fraunces',Georgia,serif}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
  input,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;width:100%;outline:none;transition:border-color .15s}
  input:focus,textarea:focus{border-color:var(--accent)}
  textarea{min-height:70px;resize:vertical}
  a{color:inherit}
  .wrap{max-width:560px;margin:0 auto;padding:18px 16px calc(110px + env(safe-area-inset-bottom))}

  /* header */
  header.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:6px 2px 18px}
  .brand small{display:block;color:var(--muted);font-size:14px;font-weight:700;margin-bottom:2px}
  .brand h1{font-size:30px;line-height:1.1;font-weight:700;margin:0;letter-spacing:-.4px}
  .school{display:inline-block;margin-top:8px;font-size:13px;font-weight:700;color:var(--muted);background:var(--card);border:1px solid var(--line);padding:4px 10px;border-radius:999px}
  .mechip{border-radius:50%;padding:3px;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:var(--shadow)}
  .mechip .dot{border:2px solid var(--card)}
  .dot{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:12px;flex:none}

  /* banners */
  .banner{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:12px;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;box-shadow:var(--shadow)}
  .banner.news{border-color:transparent;background:linear-gradient(135deg,rgba(239,111,83,.12),rgba(247,161,94,.12))}
  .banner > div{flex:1}
  .pulse{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 rgba(239,111,83,.6);animation:pulse 1.8s infinite;flex:none}
  @keyframes pulse{70%{box-shadow:0 0 0 10px rgba(239,111,83,0)}100%{box-shadow:0 0 0 0 rgba(239,111,83,0)}}
  .linkbtn{font-weight:800;color:var(--accent);white-space:nowrap}

  /* hero: today / next school day */
  .hero{position:relative;overflow:hidden;border-radius:26px;padding:18px 16px 10px;margin-bottom:18px;color:#fff;
    background:linear-gradient(140deg,#EF6F53 0%,#F48E5B 55%,#F7B267 100%);box-shadow:0 14px 34px rgba(239,111,83,.35)}
  .hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.12)}
  .hero-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;position:relative;z-index:1}
  .hero-eyebrow{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:1px;opacity:.9}
  .hero-date{font-size:26px;font-weight:700;letter-spacing:-.3px}
  .hero-art{font-size:38px;line-height:1;filter:drop-shadow(0 4px 8px rgba(0,0,0,.12))}
  .hero-row{position:relative;z-index:1;display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.18);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:16px;padding:10px 10px 10px 12px;margin-bottom:8px}
  .hero-row.is-empty{background:rgba(255,255,255,.1);border:1.5px dashed rgba(255,255,255,.55)}
  .hero-ic{font-size:24px}
  .hero-txt{flex:1;min-width:0}
  .hero-k{font-size:12px;font-weight:700;opacity:.9}
  .hero-who{font-size:17px;font-weight:800;display:flex;align-items:center;gap:7px}
  .hero-who .dot{border:2px solid rgba(255,255,255,.85)}
  .hero-btn{background:#fff;color:var(--accent);font-weight:800;font-size:14px;padding:9px 14px;border-radius:12px;white-space:nowrap}
  .hero-btn.ghost{background:rgba(255,255,255,.2);color:#fff}

  /* week navigation + coverage */
  .weeknav{display:flex;align-items:center;justify-content:space-between;margin:4px 0 10px}
  .weeknav > button{width:44px;height:44px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:22px;font-weight:800;box-shadow:var(--shadow)}
  .weeknav .label{text-align:center}
  .weeknav .label b{display:block;font-size:17px}
  .weeknav .label span{font-size:12px;color:var(--muted);font-weight:700}
  .today-link{display:block;margin:2px auto 0;color:var(--accent);font-size:12px;font-weight:800}
  .cover{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:14px;box-shadow:var(--shadow)}
  .cover-top{display:flex;justify-content:space-between;font-size:14px;margin-bottom:8px}
  .cover-top span{color:var(--muted);font-weight:700}
  .bar{height:8px;border-radius:99px;background:var(--bg2);overflow:hidden}
  .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .4s}

  /* day cards */
  .day{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:10px;box-shadow:var(--shadow)}
  .day.today{border:2px solid var(--accent)}
  .day.past{opacity:.5;box-shadow:none}
  .dayhead{display:flex;align-items:center;gap:12px;margin:0 2px 10px}
  .daynum{width:46px;height:50px;border-radius:14px;background:var(--bg2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:20px;font-weight:700;line-height:1}
  .daynum small{font-family:'Nunito',sans-serif;font-size:10px;font-weight:800;text-transform:uppercase;color:var(--muted);margin-bottom:3px;letter-spacing:.5px}
  .day.today .daynum{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
  .day.today .daynum small{color:rgba(255,255,255,.85)}
  .dayname{font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px}
  .tag{font-size:11px;font-weight:800;background:var(--accent);color:#fff;padding:3px 8px;border-radius:99px}
  .slots{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .slot{border-radius:16px;padding:10px 12px;text-align:left;min-height:74px;display:flex;flex-direction:column;justify-content:space-between;gap:6px;border:1.5px dashed #E8D9CB;background:var(--bg);transition:transform .1s, box-shadow .2s}
  .slot:active{transform:scale(.97)}
  .slot .k{font-size:12px;font-weight:700;color:var(--muted);display:flex;justify-content:space-between}
  .slot .who{font-size:15px;font-weight:800;display:flex;align-items:center;gap:7px;min-width:0}
  .slot .who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .slot.open .who{color:var(--accent)}
  .slot.taken{border-style:solid;border-color:transparent;color:#fff;box-shadow:0 6px 16px rgba(0,0,0,.12)}
  .slot.taken .k{color:rgba(255,255,255,.88)}
  .slot.taken .dot{border:2px solid rgba(255,255,255,.8)}
  .slot.mine{box-shadow:0 0 0 3px rgba(255,255,255,.9) inset, 0 6px 16px rgba(0,0,0,.12)}
  .slot[disabled]{cursor:default}
  @media (prefers-color-scheme: dark){ .slot{border-color:var(--line)} }

  /* buttons, cards, misc */
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px 16px;border-radius:16px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--accent-ink);text-decoration:none;width:100%;font-size:15px;box-shadow:0 6px 16px rgba(239,111,83,.28)}
  .btn[disabled]{opacity:.5}
  .btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
  .btn.danger{background:transparent;color:var(--warn);border:1.5px solid var(--warn);box-shadow:none}
  .btn + .btn{margin-top:8px}
  .section-title{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin:20px 6px 8px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:10px;box-shadow:var(--shadow)}
  .event{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
  .event:last-child{border-bottom:0}
  .event .txt{font-size:14px;line-height:1.4;flex:1}
  .event .time{font-size:12px;color:var(--muted);margin-top:2px}
  .new{background:var(--accent);color:#fff;font-size:10px;font-weight:800;padding:2px 7px;border-radius:99px;margin-left:6px;vertical-align:2px}

  /* tab bar */
  .tabs{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:5}
  .tabs[hidden]{display:none}
  .tabs .in{display:flex;max-width:440px;width:100%;padding:6px;border-radius:24px;background:rgba(255,255,255,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);box-shadow:0 10px 30px rgba(60,30,20,.15)}
  @media (prefers-color-scheme: dark){ .tabs .in{background:rgba(36,33,43,.85)} }
  .tab{flex:1;padding:8px 4px;border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:800;color:var(--muted);position:relative;transition:background .2s,color .2s}
  .tab .ic{font-size:20px;line-height:1}
  .tab.on{color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2))}
  .badge{position:absolute;top:2px;right:calc(50% - 24px);background:var(--ink);color:#fff;font-size:10px;font-weight:800;border-radius:999px;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;padding:0 5px}

  /* sheets */
  .sheet-bg{position:fixed;inset:0;background:rgba(30,20,30,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20;animation:fade .15s}
  .sheet{background:var(--card);width:100%;max-width:560px;border-radius:28px 28px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:up .25s cubic-bezier(.2,.9,.3,1.1)}
  .sheet h2{margin:0 0 4px;font-size:22px;font-weight:700}
  .sub{margin:0 0 14px;color:var(--muted);font-size:14px}
  .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:-6px auto 14px}
  @keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:13px;font-weight:800;margin:0 2px 6px}
  .hint{font-size:12px;color:var(--muted);margin:6px 2px 0;line-height:1.45}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .swatches{display:flex;gap:10px;flex-wrap:wrap}
  .sw{width:40px;height:40px;border-radius:50%;border:3px solid transparent;box-shadow:0 2px 6px rgba(0,0,0,.12)}
  .sw.on{border-color:var(--ink)}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .chip{padding:7px 12px;border-radius:999px;border:1.5px solid var(--line);font-size:13px;font-weight:700;background:var(--bg)}
  .toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:16px;font-weight:700;font-size:14px;z-index:30;max-width:90vw;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:fade .2s}
  .muted{color:var(--muted)}
  .empty{text-align:center;color:var(--muted);padding:26px 8px;font-size:14px}
  .members{display:flex;flex-wrap:wrap;gap:8px}
  .member{display:flex;align-items:center;gap:6px;padding:4px 12px 4px 4px;border-radius:999px;background:var(--bg);font-weight:700;font-size:13px}
  .msgbox{background:var(--bg);border-radius:14px;padding:12px 14px;font-size:14px;white-space:pre-wrap;margin-bottom:10px;border:1px solid var(--line);word-break:break-word}
  ol.steps{padding-left:20px;margin:6px 0;font-size:14px;line-height:1.6}
  .auth{max-width:420px;margin:7vh auto 0;text-align:center}
  .auth img{width:92px;height:92px;border-radius:24px;margin-bottom:12px;box-shadow:0 12px 30px rgba(239,111,83,.35)}
  .auth h1{margin:0 0 4px;font-size:32px;font-weight:700}
  .auth .card{text-align:left;margin-top:20px}
  .err{color:var(--warn);font-size:13px;font-weight:700;margin:4px 2px 10px}
  .seg{display:flex;background:var(--bg2);border-radius:14px;padding:4px;margin-bottom:14px}
  .seg button{flex:1;padding:9px;border-radius:11px;font-weight:800;font-size:14px;color:var(--muted)}
  .seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.1)}
  .ok{color:var(--ok);font-weight:800}
  .dot.has-pic{overflow:hidden;padding:0}
  .dot.has-pic img{width:100%;height:100%;object-fit:cover;display:block}
  .pic-row{display:flex;align-items:center;gap:14px}
  .pic-preview{width:76px;height:76px;border-radius:50%;overflow:hidden;flex:none;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;font-size:30px;font-weight:800;box-shadow:var(--shadow)}
  .pic-preview img{width:100%;height:100%;object-fit:cover}
  .pic-actions{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="card empty">Loading…</div></div>
<nav class="tabs" id="tabsnav" hidden><div class="in" id="tabs"></div></nav>
<div id="layer"></div>
<script src="config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
